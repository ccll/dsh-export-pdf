name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AgentMap document lint
        run: python3 tools/agentmap_lint.py --report

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Verify browser and fonts
        run: google-chrome --version && test -n "$(fc-list :lang=zh | head -1)" && pdfinfo -v | head -1

      - name: Contract check (committed bundle)
        run: pnpm check

      - name: Build client bundle
        run: pnpm build:client

      - name: Bundle drift check
        run: git diff --exit-code -- .dsh-plugin/client.js

      - name: Unit and PDF integration tests
        run: pnpm test

      - name: Browser e2e
        run: pnpm test:e2e
